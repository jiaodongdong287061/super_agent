<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Agent - AI 助手</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: #f0f2f5; color: #1a1a2e; height: 100vh; display: flex; flex-direction: column;
  }

  .login-page {
    display: flex; align-items: center; justify-content: center; height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  }
  .login-card {
    background: #fff; border-radius: 16px; padding: 48px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.15); width: 360px;
  }
  .login-card h1 { font-size: 24px; margin-bottom: 8px; }
  .login-card p { color: #666; margin-bottom: 32px; font-size: 14px; }
  .btn-login {
    display: inline-block; background: #667eea; color: #fff; border: none;
    padding: 12px 40px; border-radius: 8px; font-size: 16px; cursor: pointer;
    text-decoration: none; transition: background .2s;
  }
  .btn-login:hover { background: #5a6fd6; }

  .chat-page { display: none; flex-direction: column; height: 100vh; }
  .chat-page.active { display: flex; }

  .header {
    background: #fff; padding: 12px 24px; display: flex; align-items: center;
    justify-content: space-between; border-bottom: 1px solid #e8e8e8; flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-left h1 { font-size: 18px; font-weight: 600; }
  .header-left .badge { background: #667eea; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 4px; }
  .header-right { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #666; }
  .btn-logout {
    background: none; border: 1px solid #ddd; padding: 6px 16px; border-radius: 6px;
    font-size: 13px; cursor: pointer; color: #666; transition: all .2s;
  }
  .btn-logout:hover { border-color: #ff4d4f; color: #ff4d4f; }

  .messages {
    flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .messages:empty::after {
    content: "输入问题开始与 AI 助手对话"; display: block; text-align: center;
    color: #bbb; font-size: 14px; padding: 60px 0; user-select: none;
  }
  .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; word-wrap: break-word; }
  .message.user { background: #667eea; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .message.assistant { background: #fff; color: #1a1a2e; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .message.assistant .stream-cursor::after { content: "▌"; animation: blink 0.8s step-end infinite; }
  .message.assistant.llm-fallback { background: #fffbe6; border-left: 3px solid #faad14; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Intent / Tool call bubbles */
  .event-bubble {
    align-self: flex-start; font-size: 12px; color: #888; padding: 4px 0;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .event-bubble .tag {
    display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;
  }
  .tag-intent { background: #e6f7ff; color: #1890ff; }
  .tag-tool-call { background: #fff7e6; color: #fa8c16; }
  .tag-tool-result { background: #f6ffed; color: #52c41a; }
  .tag-step { background: #f0f0f0; color: #666; }
  .tag-guardrails { background: #fff2f0; color: #ff4d4f; }
  .tag-guardrails-warn { background: #fffbe6; color: #faad14; }

  .citations { margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; }
  .citations summary { font-size: 12px; color: #667eea; cursor: pointer; font-weight: 500; }
  .citations-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .citation-item { font-size: 12px; color: #666; padding: 4px 8px; background: #f8f9ff; border-radius: 4px; }
  .citation-item .src { color: #333; font-weight: 500; }
  .citation-item .snippet { color: #888; display: block; margin-top: 2px; }

  .input-area { flex-shrink: 0; padding: 12px 24px 20px; background: #f0f2f5; }
  .input-wrapper {
    display: flex; gap: 8px; background: #fff; border: 1px solid #e8e8e8;
    border-radius: 12px; padding: 8px 12px; align-items: flex-end; transition: border-color .2s;
  }
  .input-wrapper:focus-within { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
  .input-wrapper textarea {
    flex: 1; border: none; outline: none; font-size: 14px; font-family: inherit;
    resize: none; max-height: 120px; line-height: 1.5; padding: 4px 0;
  }
  .btn-send {
    background: #667eea; color: #fff; border: none; width: 36px; height: 36px;
    border-radius: 8px; cursor: pointer; font-size: 18px; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0; transition: background .2s;
  }
  .btn-send:hover { background: #5a6fd6; }
  .btn-send:disabled { background: #ccc; cursor: not-allowed; }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
  .messages::-webkit-scrollbar-thumb:hover { background: #bbb; }
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-card">
    <h1>Super Agent</h1>
    <p>AI 智能助手，请登录后使用</p>
    <a class="btn-login" href="/auth/login">登录 / 注册</a>
  </div>
</div>

<div class="chat-page" id="chatPage">
  <div class="header">
    <div class="header-left">
      <h1>Super Agent</h1>
      <span class="badge">AI 助手</span>
    </div>
    <div class="header-right">
      <span id="userDisplay"></span>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="input" rows="1" placeholder="输入你的问题..." onkeydown="onKeyDown(event)"></textarea>
      <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const STATE = { userId: '', username: '', loading: false, assistantDiv: null, contentDiv: null };

(async () => {
  try {
    const res = await fetch('/auth/me');
    if (res.ok) {
      const user = await res.json();
      STATE.userId = user.user_id;
      STATE.username = user.display_name || user.username;
      document.getElementById('userDisplay').textContent = STATE.username || STATE.userId;
    }
  } catch { /* dev mode, stay anonymous */ }
  // 开发模式（SSO 关闭）直接进入聊天，不卡在登录页
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('chatPage').classList.add('active');
})();

function logout() { window.location.href = '/auth/logout'; }

const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const messages = document.getElementById('messages');

input.addEventListener('input', () => {
  sendBtn.disabled = !input.value.trim() || STATE.loading;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

function onKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function addEventBubble(html) {
  const div = document.createElement('div');
  div.className = 'event-bubble';
  div.innerHTML = html;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || STATE.loading) return;

  STATE.loading = true;
  sendBtn.disabled = true;

  // User message
  const userDiv = document.createElement('div');
  userDiv.className = 'message user';
  userDiv.innerHTML = `<div>${escapeHtml(text)}</div>`;
  messages.appendChild(userDiv);
  input.value = '';
  input.style.height = 'auto';

  // Assistant placeholder
  STATE.assistantDiv = document.createElement('div');
  STATE.assistantDiv.className = 'message assistant';
  STATE.contentDiv = document.createElement('div');
  STATE.contentDiv.className = 'content stream-cursor';
  STATE.assistantDiv.appendChild(STATE.contentDiv);
  messages.appendChild(STATE.assistantDiv);
  messages.scrollTop = messages.scrollHeight;

  try {
    const res = await fetch('/agent/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: text }),
    });

    if (!res.ok) {
      STATE.contentDiv.textContent = `请求失败 (${res.status})`;
      STATE.contentDiv.classList.remove('stream-cursor');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      // Keep the potentially incomplete last line in buffer
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const event = JSON.parse(line.slice(6));
          switch (event.type) {
            case 'guardrails':
              const tagClass = event.verdict === 'block' ? 'tag-guardrails' : 'tag-guardrails-warn';
              const icon = event.verdict === 'block' ? '🚫' : '⚠️';
              addEventBubble(`<span class="tag ${tagClass}">${icon} 安全检测: ${event.reason}</span>`);
              break;
            case 'intent':
              if (event.tools) {
                addEventBubble(`<span class="tag tag-intent">意图: ${event.intent}</span> <span class="tag tag-tool-call">工具: ${event.tools.join(', ')}</span>`);
              } else {
                addEventBubble(`<span class="tag tag-intent">意图: ${event.intent}</span>`);
              }
              break;
            case 'step':
              addEventBubble(`<span class="tag tag-step">步骤 ${event.step}/${event.max_steps}</span>`);
              break;
            case 'tool_call':
              addEventBubble(`<span class="tag tag-tool-call">⚡ 调用 ${event.name}(${JSON.stringify(event.params)})</span>`);
              break;
            case 'tool_result':
              const icon = event.success ? '✅' : '❌';
              addEventBubble(`<span class="tag tag-tool-result">${icon} ${event.name}: ${JSON.stringify(event.data || event.error)}</span>`);
              break;
            case 'source':
              if (event.source === 'llm_fallback') {
                STATE.assistantDiv.classList.add('llm-fallback');
              }
              break;
            case 'sources':
              if (event.sources && event.sources.length) {
                renderCitations(STATE.assistantDiv, event.sources);
              }
              break;
            case 'token':
              STATE.contentDiv.textContent += event.text;
              messages.scrollTop = messages.scrollHeight;
              break;
            case 'done':
              STATE.contentDiv.classList.remove('stream-cursor');
              break;
            case 'error':
              STATE.contentDiv.textContent = '出错了: ' + event.message;
              STATE.contentDiv.classList.remove('stream-cursor');
              break;
          }
        } catch { /* skip partial */ }
      }
    }
    STATE.contentDiv.classList.remove('stream-cursor');
  } catch (err) {
    STATE.contentDiv.textContent = '网络错误: ' + err.message;
    STATE.contentDiv.classList.remove('stream-cursor');
  } finally {
    STATE.loading = false;
    sendBtn.disabled = !input.value.trim();
    messages.scrollTop = messages.scrollHeight;
  }
}

function renderCitations(assistantDiv, sources) {
  const existing = assistantDiv.querySelector('.citations');
  if (existing) existing.remove();

  const details = document.createElement('details');
  details.className = 'citations';
  details.open = true;
  const summary = document.createElement('summary');
  summary.textContent = `📎 ${sources.length} 个来源`;
  details.appendChild(summary);

  const list = document.createElement('div');
  list.className = 'citations-list';
  for (const c of sources) {
    const item = document.createElement('div');
    item.className = 'citation-item';
    const pages = c.page_numbers && c.page_numbers.length ? ` · 第 ${c.page_numbers.join(', ')} 页` : '';
    item.innerHTML = `<span class="src">${escapeHtml(c.source_doc)}</span>${pages}<span class="snippet">${escapeHtml(c.content_snippet)}</span>`;
    list.appendChild(item);
  }
  details.appendChild(list);
  assistantDiv.appendChild(details);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
