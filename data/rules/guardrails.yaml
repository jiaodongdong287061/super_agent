# Guardrails 规则配置
# 修改此文件后自动生效，无需重启服务

# ── Prompt 注入检测（正则表达式） ──
injection_patterns:
  - "忽略(以上|所有|系统|之前).*(指令|提示|设置|规则)"
  - "ignore\\s+(all\\s+)?(above|previous|system).*(instructions|prompts|commands)"
  - "你(现在|将)是"
  - "you\\s+are\\s+(now\\s+)?(a\\s+)?(free|unrestricted)"
  - "忘记(你|所有).*(身份|角色|设定)"
  - "forget\\s+(your|all).*(identity|role|constraints)"
  - "突破.*(限制|规则|边界)"
  - "bypass\\s+(restrictions|rules|limits)"

# ── 非企业领域黑名单（命中直接拦截/警告） ──
