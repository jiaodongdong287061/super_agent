# ── 输出敏感信息掩码（正则 → 替换模板） ──
output_sensitive_patterns:
  - pattern: "\\b(\\d{1,3}\\.){3}\\d{1,3}\\b"
    mask: "***.***.***.***"
  - pattern: "(?i)(password|passwd|pwd)\\s*[=:]\\s*\\S+"
    mask: "\\1=***"
  - pattern: "(?i)(secret|token|apikey|private_key)\\s*[=:]\\s*\\S+"
    mask: "\\1=***"
  - pattern: "\\b\\d{17}[\\dXx]\\b"
    mask: "******************"
