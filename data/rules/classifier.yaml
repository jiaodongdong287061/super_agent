# Classifier 规则配置
# 修改此文件后自动生效，无需重启服务

# ── QA 关键词（极窄，仅问候/闲聊/元问题） ──
qa_keywords:
  - "你好"
  - "嗨"
  - "hi"
  - "hello"
  - "你是谁"
  - "你能做什么"
  - "help"
  - "帮助"
  - "谢谢"
  - "感谢"
  - "再见"
  - "拜拜"
  # 日期/时间/闲聊类 — 不走知识库，直接 LLM 回答
  - "今天"
  - "明天"
  - "昨天"
  - "星期"
  - "日期"
  - "时间"
  - "节日"
  # 通用咨询类 — 非IT知识，直接问 LLM
  - "有什么"

# ── Knowledge 关键词（宽泛，默认兜底） ──
knowledge_keywords:
  - "怎么看"
  - "怎么查"
  - "如何"
  - "步骤"
  - "方法"
  - "区别"
  - "什么是"
  - "为什么"
  - "原因"
  - "原理"
  - "对比"
  - "是什么意思"
  - "怎么用"
  - "怎么配置"
  - "怎么安装"
  - "怎么设置"

# ── Action 单步操作关键词 ──
action_simple_keywords:
  - "查一下"
  - "查询"
  - "搜索"
  - "创建"
  - "删除"
  - "更新"
  - "修改"
  - "部署"
  - "重启"
  - "启动"
  - "停止"
  - "执行"
  - "运行"
  - "发送"
  - "通知"
  - "审批"
  - "批准"
  - "驳回"
  - "关闭"
  - "开启"

# ── Action 多步排查关键词 ──
action_multi_keywords:
  - "排查"
  - "处理"
  - "修复"
  - "分析"
  - "诊断"
  - "巡检"
  - "检查"
  - "优化"
  - "迁移"
  - "升级"

# ── Embedding 分类样本（完整问句，用于语义匹配） ──
# EmbeddingClassifier 会用这些句子预计算向量，
# 新 query 的向量与这些样本比相似度，取最接近的类别
qa_examples:
  - "你好"
  - "今天天气怎么样"
  - "今天是什么节日"
  - "几点了"
  - "你叫什么名字"
  - "再见"
  - "谢谢"
  - "帮我查一下今天几号"
  # 通用知识类 — 非企业知识，直接问 LLM
  - "唱歌有什么好的技巧"
  - "怎么做红烧肉"
  - "如何学好英语"
  - "有什么好看的电影推荐"
  - "怎么提高跑步速度"

knowledge_examples:
  - "什么是主从复制"
  - "mysql 怎么部署"
  - "磁盘IO瓶颈如何排查"
  - "公司年假政策是什么"
  - "k8s pod 起不来怎么排查"
  - "nginx 反向代理怎么配置"
  - "数据库慢查询怎么优化"
  - "Redis 主从同步延迟怎么处理"
  - "服务器内存使用率高怎么排查"
  - "负载均衡的算法有哪些"

action_examples:
  - "重启服务器 10.0.1.5"
  - "查一下 Jenkins 构建 #123 的日志"
  - "创建工单，描述磁盘空间不足"
  - "部署最新版本到预发布环境"
  - "发通知给所有人，今晚有维护窗口"
  - "检查所有节点的磁盘使用率"
  - "查看 10.0.1.5 的网络流量"
  - "删除过期的备份文件"
  - "审批工单 #456"
  - "关闭 10.0.1.5 的防火墙"

# ── 风险等级关键词 ──
risk_high_keywords:
  - "重启"
  - "关闭"
  - "停止"
  - "删除"
  - "销毁"
  - "格式化"
  - "reset"
  - "reboot"
  - "shutdown"
  - "delete"
  - "drop"

risk_medium_keywords:
  - "更新"
  - "修改"
  - "创建"
  - "部署"
  - "发送"
  - "通知"
  - "审批"
  - "升级"
  - "迁移"
